<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee3c4"><title>Posterboard Quest — Web Prototype 0.6 Clean</title><style>:root{--paper:#eee3c4;--paper2:#f8efd7;--ink:#2e2a23}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}body{font-family:Georgia,serif}button{font:700 16px system-ui;color:var(--ink);background:#fff8e8;border:1px solid #665e4d;border-radius:10px;min-height:48px;padding:10px 14px}button:disabled{opacity:.42}.primary{background:var(--ink);color:white}#app{max-width:960px;margin:auto;padding:10px}header{text-align:center}h1{font-size:25px;margin:4px}.subtitle{font:12px system-ui;opacity:.68}.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font:600 13px system-ui;margin:8px}.pill{background:#ffffff70;border:1px solid #8a806b;border-radius:999px;padding:6px 10px}#message{min-height:42px;font:15px system-ui}.viewport{height:55vh;min-height:300px;overflow:auto;border:1px solid #776f5f;border-radius:8px;background:var(--paper2)}.map{position:relative;width:896px;height:704px;background-image:linear-gradient(to right,#28231c33 1px,transparent 1px),linear-gradient(to bottom,#28231c33 1px,transparent 1px);background-size:32px 32px}.terrain-art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.terrain-art *{vector-effect:non-scaling-stroke}.label{position:absolute;font:italic 12px Georgia}.player{position:absolute;width:24px;height:24px;margin:4px;border:2px solid var(--paper2);border-radius:50%;background:var(--ink);color:white;display:flex;align-items:center;justify-content:center;z-index:5}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.dpad{display:grid;grid-template-columns:repeat(3,52px);justify-content:center;gap:6px;margin-top:9px}.dpad button{padding:0;font-size:21px}.blank{visibility:hidden}.legend{font:12px system-ui;opacity:.72;text-align:center;margin:8px}.overlay{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.card{background:var(--paper2);border:1px solid #6d634f;border-radius:12px;padding:24px;max-width:390px;width:100%;text-align:center}.card button{width:100%;margin-top:8px}.hidden{display:none!important}</style></head><body><div id="app"><header><h1>POSTERBOARD QUEST</h1><div class="subtitle">web prototype 0.6 clean · 28 × 22 pencil-grid journey</div><div class="stats"><span class="pill" id="health">Health 6/6</span><span class="pill" id="terrain">Terrain Open</span><span class="pill" id="movement">Movement 0</span><span class="pill" id="last">Last roll —</span></div><div id="message">Roll the die to begin your journey.</div></header><div class="viewport" id="viewport"><div class="map" id="map"></div></div><div class="controls"><button class="primary" id="roll">ROLL d6</button><button id="end">END MOVE</button></div><div class="dpad"><span class="blank"></span><button data-dir="0,-1">↑</button><span class="blank"></span><button data-dir="-1,0">←</button><button data-dir="0,1">↓</button><button data-dir="1,0">→</button></div><div class="legend">Open 1 · Forest 2 · Mountain 3 · minimum one legal step on a fresh roll · bridges cross normally · river crossing: 1 death, 2–5 penalties, 6 clean</div></div><div class="overlay hidden" id="overlay"><div class="card"><h2 id="ctitle"></h2><p id="cintro"></p><div id="coutcome"></div><button class="primary" id="croll">ROLL d6</button><button class="primary hidden" id="continue">CONTINUE</button><button class="hidden" id="cancel">CANCEL CROSSING</button></div></div><script>'use strict';const W=28,H=22,S=32,MAX=6;let player={x:1,y:20},dest={x:26,y:1},move=0,health=MAX,last=null,enc=null,done=false,river=null,mode=null,steps=0;const terr=new Map(),K=(x,y)=>`${x},${y}`,set=(t,x,y)=>terr.set(K(x,y),t);set('village',1,20);set('tower',26,1);for(let y=0;y<H;y++)set('river',13,y);set('bridge',13,6);set('bridge',13,17);for(let x=16;x<=24;x++){let y=Math.max(2,13-(x-16));set('mountain',x,y);set('mountain',x,y+1)}[[4,17],[5,17],[6,17],[5,16],[6,16],[7,16],[8,8],[9,8],[10,8],[8,9],[9,9],[10,9],[18,18],[19,18],[20,18],[19,17],[20,17],[21,17]].forEach(p=>set('forest',...p));const encounters=[['ORC','An orc lumbers onto the path, gripping a chipped axe.'],['BANDITS','Bandits step from the brush and block the road.'],['FAIRY','A tiny light becomes a fairy.'],['TROLL','A troll watches you from beside the road.'],['OLD WOMAN','An old woman waits beside the road.']];const riverResults={1:['The current takes you.','You are swept away and drowned.',true],2:['A brutal crossing.','You reach the far bank but lose all remaining movement.','all'],3:['A punishing crossing.','You reach the far bank but lose 3 movement.',3],4:['A rough crossing.','You reach the far bank but lose 2 movement.',2],5:['A wobbly crossing.','You reach the far bank but lose 1 movement.',1],6:['A clean crossing.','You cross safely with no movement penalty.',0]};const $=x=>document.getElementById(x),map=$('map'),vp=$('viewport');function die(){return Math.floor(Math.random()*6)+1}function tAt(x,y){return terr.get(K(x,y))||'plain'}function mt(t){return t==='forest'?'forest':t==='mountain'?'mountain':'open'}function tn(t){return t==='forest'?'Forest':t==='mountain'?'Mountain':'Open'}function cost(t){return t==='forest'?2:t==='mountain'?3:1}function el(n,a={}){let e=document.createElementNS('http://www.w3.org/2000/svg',n);for(let k in a)e.setAttribute(k,a[k]);return e}function jit(n,r){let q=Math.sin(n*12.9898+78.233)*43758.5453;return((q-Math.floor(q))*2-1)*r}function draw(){let s=el('svg',{class:'terrain-art',viewBox:'0 0 896 704'}),p={fill:'none',stroke:'#5b564d','stroke-width':'1.05','stroke-linecap':'round','stroke-linejoin':'round',opacity:'.78'},f={...p,'stroke-width':'.7',opacity:'.35'};let L=`M 405 0 C 394 62 417 124 404 183 C 394 238 425 299 410 362 C 398 425 424 492 408 560 C 400 613 422 665 413 704`,R=`M 427 0 C 415 64 437 124 424 183 C 414 238 443 299 429 362 C 418 425 444 492 428 560 C 420 613 442 665 430 704`;s.append(el('path',{d:L,...p,'stroke-width':'1.45'}),el('path',{d:R,...p,'stroke-width':'1.35'}));for(let y=22;y<704;y+=37){let x=416+jit(y,6);s.append(el('path',{d:`M ${x-7} ${y} q 5 -3 10 -1 q 5 3 10 0`,...f}))}[6,17].forEach((gy,i)=>{let cy=gy*32+16,cx=417;s.append(el('path',{d:`M ${cx-14} ${cy-8} Q ${cx} ${cy-12} ${cx+14} ${cy-7} M ${cx-14} ${cy+8} Q ${cx} ${cy+10} ${cx+14} ${cy+7}`,...p,'stroke-width':'1.35'}));for(let q=-10;q<=10;q+=5)s.append(el('line',{x1:cx+q,y1:cy-8,x2:cx+q+1,y2:cy+8,...f}))});let i=0;for(let [k,t] of terr){let[x,y]=k.split(',').map(Number);if(t==='forest'){let cx=x*32+16+jit(i,2),b=y*32+28,h=20+jit(i+20,2),top=b-h;for(let z=0;z<5;z++){let yy=top+z*4,w=8-z*.7;s.append(el('path',{d:`M ${cx} ${yy} L ${cx-w} ${yy+5} L ${cx} ${yy+4} L ${cx+w} ${yy+5}`,...p}))}s.append(el('line',{x1:cx,y1:top+5,x2:cx,y2:b,...p}));i++}}i=0;for(let[k,t]of terr){let[x,y]=k.split(',').map(Number);if(t==='mountain'){let cx=x*32+16+jit(i+100,2),b=y*32+27,h=18+jit(i+140,2),w=12+jit(i+160,1.5),pk=cx+jit(i+180,1.5);s.append(el('path',{d:`M ${cx-w} ${b} L ${pk} ${b-h} L ${cx+w} ${b}`,...p,'stroke-width':'1.2'}));s.append(el('path',{d:`M ${pk} ${b-h+3} l -5 7 l 4 -1 l 4 5`,...f}));i++}}s.append(el('path',{d:'M 36 668 L 36 655 L 48 647 L 60 655 L 60 668 Z M 45 668 L 45 660 L 51 660 L 51 668',...p}));map.append(s)}draw();[['Home',1,20],['Ruined Tower',24,2]].forEach(([txt,x,y])=>{let d=document.createElement('div');d.className='label';d.style.left=x*32+'px';d.style.top=y*32+'px';d.textContent=txt;map.append(d)});let tok=document.createElement('div');tok.className='player';tok.textContent='✦';map.append(tok);function msg(x){$('message').textContent=x}function can(){return !done&&!enc&&!river&&move>0}function render(){tok.style.left=player.x*32+4+'px';tok.style.top=player.y*32+4+'px';$('health').textContent=`Health ${health}/${MAX}`;$('terrain').textContent=`Terrain ${tn(mt(tAt(player.x,player.y)))}`;$('movement').textContent=`Movement ${move}`;$('last').textContent=`Last roll ${last??'—'}`;$('roll').disabled=done||enc||river||move>0;$('end').disabled=done||enc||river||move<=0;document.querySelectorAll('[data-dir]').forEach(b=>b.disabled=!can())}function showRiver(dx,dy){river={dx,dy,r:null};mode='river';$('overlay').classList.remove('hidden');$('ctitle').textContent='RIVER CROSSING';$('cintro').textContent='The current looks dangerous.';$('coutcome').textContent='Roll to see what happens.';$('croll').classList.remove('hidden');$('continue').classList.add('hidden');$('cancel').classList.remove('hidden');render()}function go(x,y){if(!can()||x<0||y<0||x>=W||y>=H||Math.abs(x-player.x)+Math.abs(y-player.y)!==1)return;let t=tAt(x,y);if(t==='river'){showRiver(x-player.x,y-player.y);return}let m=mt(t),c=cost(m),first=steps===0;if(move<c&&!first){msg(`${tn(m)} costs ${c} movement to enter. You have ${move}.`);return}player={x,y};move=Math.max(0,move-c);steps++;msg(`Entered ${tn(m)}. Cost ${c}. ${move} movement remaining.`);if(x===dest.x&&y===dest.y){done=true;alert('You reached the ruined tower!');}if(move===0)endTurn();render();save()}function endTurn(){if(Math.random()<.55){enc=encounters[Math.floor(Math.random()*encounters.length)];mode='enc';$('overlay').classList.remove('hidden');$('ctitle').textContent=enc[0];$('cintro').textContent=enc[1];$('coutcome').textContent='Roll to see what happens.';$('croll').classList.remove('hidden');$('continue').classList.add('hidden');$('cancel').classList.add('hidden')}else msg('The road is quiet. Roll again.')}map.addEventListener('pointerup',e=>{let r=map.getBoundingClientRect();go(Math.floor((e.clientX-r.left)/32),Math.floor((e.clientY-r.top)/32))});document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{let[dX,dY]=b.dataset.dir.split(',').map(Number);go(player.x+dX,player.y+dY)});$('roll').onclick=()=>{if(done||enc||river||move)return;last=die();move=last;steps=0;msg(`Rolled ${last}. You have ${move} movement.`);render();save()};$('end').onclick=()=>{if(move>0&&!enc&&!river){move=0;endTurn();render();save()}};$('croll').onclick=()=>{if(mode==='river'){let r=die();river.r=r,a=riverResults[r];$('coutcome').innerHTML=`<b>You rolled ${r}</b><br><br>${a[0]} ${a[1]}`;$('croll').classList.add('hidden');$('continue').classList.remove('hidden');$('continue').textContent=r===1?'CONTINUE':'CROSS RIVER';$('cancel').classList.add('hidden');return}let r=die(),delta=r<=1?-2:r===2?-1:r>=5?1:0;health=Math.max(0,Math.min(MAX,health+delta));$('coutcome').innerHTML=`<b>You rolled ${r}</b><br><br>${delta<0?'You are hurt.':delta>0?'You find provisions.':'You get through unharmed.'}`;$('croll').classList.add('hidden');$('continue').classList.remove('hidden');if(health<=0)done=true;render();save()};$('cancel').onclick=()=>{river=null;mode=null;$('overlay').classList.add('hidden');render()};$('continue').onclick=()=>{if(mode==='river'){let r=river.r,a=riverResults[r];if(a[2]===true){health=0;done=true;river=null;mode=null;$('overlay').classList.add('hidden');msg('The river took you. The journey ends.');render();save();return}player={x:player.x+river.dx*2,y:player.y+river.dy*2};steps++;move=a[2]==='all'?0:Math.max(0,move-a[2]);river=null;mode=null;$('overlay').classList.add('hidden');msg(`River roll ${r}. ${a[1]} ${move} movement remaining.`);if(move===0)endTurn();render();save();return}$('overlay').classList.add('hidden');enc=null;mode=null;if(done)msg('The journey ends.');else msg('Roll the die for your next move.');render();save()};function save(){localStorage.setItem('pbq06clean',JSON.stringify({player,move,health,last,done,steps}))}try{let s=JSON.parse(localStorage.getItem('pbq06clean'));if(s){player=s.player||player;move=s.move||0;health=s.health??MAX;last=s.last??null;done=!!s.done;steps=s.steps||0;msg('Journey restored from this device.')}}catch(e){}render();requestAnimationFrame(()=>{vp.scrollLeft=Math.max(0,player.x*32-vp.clientWidth/2);vp.scrollTop=Math.max(0,player.y*32-vp.clientHeight/2)});</script></body></html>
